name: Build portfolio
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py', 'tools/**', 'css/**', 'js/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown yt-dlp
      - name: Fetch & compress videos
        run: python3 tools/fetch_media.py
      - name: Build site
        run: python3 build.py
      - name: Commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "build: videos + pages" && git push)
