name: Build portfolio
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py', 'tools/**', 'css/**', 'js/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        timeout-minutes: 5
        run: |
          pip install -q -U gdown "yt-dlp[default]" imageio-ffmpeg
          mkdir -p "$HOME/bin" && ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch & compress videos
        timeout-minutes: 75
        run: python3 tools/fetch_media.py
      - name: Build site
        run: python3 build.py
      - name: Commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "build: videos + pages" && git push)
