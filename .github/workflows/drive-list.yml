name: List Drive folder
on:
  workflow_dispatch:
    inputs:
      url: {description: 'Google Drive folder URL', required: true}
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gdown
      - name: List
        env: {URL: "${{ inputs.url }}"}
        run: |
          python3 - <<'PY'
          import gdown, os, traceback
          try:
              files = gdown.download_folder(os.environ['URL'], skip_download=True, quiet=False, remaining_ok=True) or []
              out = ''.join(f'{f.id}\t{f.path}\n' for f in files)
          except Exception:
              out = 'ERROR\n' + traceback.format_exc()
          open('media/_drive_list.txt', 'w').write(out)
          print(out)
          PY
      - run: |
          git config user.name "portfolio-bot"; git config user.email "actions@users.noreply.github.com"
          git add media/_drive_list.txt; git diff --cached --quiet || (git commit -m "drive list" && git push)
